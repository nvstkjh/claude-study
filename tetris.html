<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>테트리스</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #fff;
  }
  #container {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }
  canvas {
    border: 2px solid #e94560;
    box-shadow: 0 0 20px #e9456066;
    display: block;
  }
  #panel {
    width: 140px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .box {
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 6px;
    padding: 12px;
  }
  .box h3 {
    font-size: 11px;
    color: #e94560;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .box p {
    font-size: 22px;
    font-weight: bold;
  }
  #nextCanvas {
    display: block;
    margin: 0 auto;
  }
  #lives-display {
    font-size: 20px;
    letter-spacing: 4px;
  }
  @keyframes flash {
    0%   { box-shadow: 0 0 0 4px #e94560; }
    50%  { box-shadow: 0 0 40px 10px #e94560; }
    100% { box-shadow: 0 0 20px #e9456066; }
  }
  .flash { animation: flash 0.5s ease-out; }
  #keys {
    font-size: 11px;
    line-height: 2;
    color: #aaa;
  }
  #keys span { color: #e94560; }
  #overlay {
    position: fixed;
    inset: 0;
    background: #0008;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
  }
  #overlay h1 { font-size: 36px; color: #e94560; }
  #overlay p { color: #ccc; }
  #overlay button {
    margin-top: 8px;
    padding: 10px 32px;
    background: #e94560;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    font-family: inherit;
  }
  #overlay button:hover { background: #c73652; }
</style>
</head>
<body>
<div id="container">
  <canvas id="board" width="300" height="600"></canvas>
  <div id="panel">
    <div class="box">
      <h3>점수</h3>
      <p id="score">0</p>
    </div>
    <div class="box">
      <h3>레벨</h3>
      <p id="level">1</p>
    </div>
    <div class="box">
      <h3>줄</h3>
      <p id="lines">0</p>
    </div>
    <div class="box">
      <h3>목숨</h3>
      <p id="lives-display">❤️❤️❤️</p>
    </div>
    <div class="box">
      <h3>다음</h3>
      <canvas id="nextCanvas" width="120" height="120"></canvas>
    </div>
    <div class="box" id="keys">
      <span>←→</span> 이동<br>
      <span>↑</span> 회전<br>
      <span>↓</span> 내리기<br>
      <span>Space</span> 즉시낙하<br>
      <span>P</span> 일시정지
    </div>
  </div>
</div>

<div id="overlay">
  <h1>테트리스</h1>
  <p>키보드로 블록을 조종하세요</p>
  <button id="startBtn">시작</button>
</div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;
const COLORS = [
  null,
  '#00f5ff', // I
  '#ffd700', // O
  '#9b59b6', // T
  '#2ecc71', // S
  '#e74c3c', // Z
  '#3498db', // J
  '#f39c12', // L
];
const SHAPES = [
  null,
  [[1,1,1,1]],                          // I
  [[2,2],[2,2]],                         // O
  [[0,3,0],[3,3,3]],                     // T
  [[0,4,4],[4,4,0]],                     // S
  [[5,5,0],[0,5,5]],                     // Z
  [[6,0,0],[6,6,6]],                     // J
  [[0,0,7],[7,7,7]],                     // L
];

const boardCanvas = document.getElementById('board');
const ctx = boardCanvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nCtx = nextCanvas.getContext('2d');

let board, piece, nextPiece, score, level, lines, lives, gameLoop, paused, gameOver;
const MAX_LIVES = 3;

function newBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(0));
}

function randomPiece() {
  const id = Math.floor(Math.random() * 7) + 1;
  const shape = SHAPES[id].map(r => [...r]);
  return { id, shape, x: Math.floor((COLS - shape[0].length) / 2), y: 0 };
}

function drawBlock(c, x, y, colorId, size = BLOCK) {
  if (!colorId) return;
  c.fillStyle = COLORS[colorId];
  c.fillRect(x * size + 1, y * size + 1, size - 2, size - 2);
  c.fillStyle = 'rgba(255,255,255,0.15)';
  c.fillRect(x * size + 1, y * size + 1, size - 2, 6);
}

function drawBoard() {
  ctx.fillStyle = '#0d0d1a';
  ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);

  // grid
  ctx.strokeStyle = '#1a1a3e';
  ctx.lineWidth = 0.5;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeRect(c * BLOCK, r * BLOCK, BLOCK, BLOCK);
    }
  }

  // settled blocks
  board.forEach((row, r) => row.forEach((v, c) => drawBlock(ctx, c, r, v)));

  // ghost piece
  const ghost = getGhost();
  ghost.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect((ghost.x + c) * BLOCK + 1, (ghost.y + r) * BLOCK + 1, BLOCK - 2, BLOCK - 2);
    }
  }));

  // current piece
  piece.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v) drawBlock(ctx, piece.x + c, piece.y + r, v);
  }));
}

function drawNext() {
  nCtx.fillStyle = '#0d0d1a';
  nCtx.fillRect(0, 0, 120, 120);
  const s = 24;
  const ox = Math.floor((5 - nextPiece.shape[0].length) / 2);
  const oy = Math.floor((5 - nextPiece.shape.length) / 2);
  nextPiece.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v) {
      nCtx.fillStyle = COLORS[v];
      nCtx.fillRect((ox + c) * s + 1, (oy + r) * s + 1, s - 2, s - 2);
      nCtx.fillStyle = 'rgba(255,255,255,0.15)';
      nCtx.fillRect((ox + c) * s + 1, (oy + r) * s + 1, s - 2, 5);
    }
  }));
}

function getGhost() {
  const g = { shape: piece.shape, x: piece.x, y: piece.y };
  while (!collide(g.shape, g.x, g.y + 1)) g.y++;
  return g;
}

function collide(shape, px, py) {
  for (let r = 0; r < shape.length; r++) {
    for (let c = 0; c < shape[r].length; c++) {
      if (!shape[r][c]) continue;
      const nx = px + c, ny = py + r;
      if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
      if (ny >= 0 && board[ny][nx]) return true;
    }
  }
  return false;
}

function rotate(shape) {
  const rows = shape.length, cols = shape[0].length;
  return Array.from({length: cols}, (_, c) =>
    Array.from({length: rows}, (_, r) => shape[rows - 1 - r][c])
  );
}

function lock() {
  piece.shape.forEach((row, r) => row.forEach((v, c) => {
    if (v && piece.y + r >= 0) board[piece.y + r][piece.x + c] = v;
  }));
  clearLines();
  piece = nextPiece;
  nextPiece = randomPiece();
  if (collide(piece.shape, piece.x, piece.y)) loseLife();
}

function updateLivesDisplay() {
  document.getElementById('lives-display').textContent = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
}

function loseLife() {
  lives--;
  updateLivesDisplay();
  if (lives <= 0) {
    endGame();
    return;
  }
  clearInterval(gameLoop);
  boardCanvas.classList.add('flash');
  boardCanvas.addEventListener('animationend', () => {
    boardCanvas.classList.remove('flash');
  }, { once: true });
  board = newBoard();
  piece = randomPiece();
  nextPiece = randomPiece();
  resetLoop();
  drawBoard();
  drawNext();
}

const LINE_SCORES = [0, 100, 300, 500, 800];

function clearLines() {
  let cleared = 0;
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r].every(v => v)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(0));
      cleared++;
      r++;
    }
  }
  if (cleared) {
    score += LINE_SCORES[cleared] * level;
    lines += cleared;
    level = Math.floor(lines / 10) + 1;
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = level;
    document.getElementById('lines').textContent = lines;
    resetLoop();
  }
}

function moveDown() {
  if (!collide(piece.shape, piece.x, piece.y + 1)) {
    piece.y++;
  } else {
    lock();
    if (gameOver) return;
  }
  drawBoard();
  drawNext();
}

function hardDrop() {
  while (!collide(piece.shape, piece.x, piece.y + 1)) {
    piece.y++;
    score += 2;
  }
  document.getElementById('score').textContent = score;
  lock();
  if (gameOver) return;
  drawBoard();
  drawNext();
}

function getSpeed() {
  return Math.max(100, 800 - (level - 1) * 70);
}

function resetLoop() {
  clearInterval(gameLoop);
  gameLoop = setInterval(moveDown, getSpeed());
}

function startGame() {
  board = newBoard();
  score = 0; level = 1; lines = 0; lives = MAX_LIVES; paused = false; gameOver = false;
  document.getElementById('score').textContent = 0;
  document.getElementById('level').textContent = 1;
  document.getElementById('lines').textContent = 0;
  updateLivesDisplay();
  piece = randomPiece();
  nextPiece = randomPiece();
  document.getElementById('overlay').style.display = 'none';
  resetLoop();
  drawBoard();
  drawNext();
}

function endGame() {
  clearInterval(gameLoop);
  gameOver = true;
  const ov = document.getElementById('overlay');
  ov.innerHTML = `<h1>게임 오버</h1><p>점수: ${score} &nbsp;|&nbsp; 레벨: ${level}</p><button id="startBtn">다시 시작</button>`;
  ov.style.display = 'flex';
  document.getElementById('startBtn').addEventListener('click', startGame, { once: true });
}

document.addEventListener('keydown', e => {
  if (gameOver) return;
  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    if (paused) clearInterval(gameLoop);
    else resetLoop();
    return;
  }
  if (paused) return;
  switch (e.key) {
    case 'ArrowLeft':
      if (!collide(piece.shape, piece.x - 1, piece.y)) { piece.x--; drawBoard(); }
      break;
    case 'ArrowRight':
      if (!collide(piece.shape, piece.x + 1, piece.y)) { piece.x++; drawBoard(); }
      break;
    case 'ArrowDown':
      moveDown();
      break;
    case 'ArrowUp': {
      const r = rotate(piece.shape);
      for (const dx of [0, -1, 1, -2, 2]) {
        if (!collide(r, piece.x + dx, piece.y)) {
          piece.shape = r; piece.x += dx; drawBoard(); break;
        }
      }
      break;
    }
    case ' ':
      e.preventDefault();
      hardDrop();
      break;
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);
</script>
</body>
</html>
